name: Import SmartGen OTA 4.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-smartgen-ota-432.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download validated flasher artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-77d4-8210-8810-5c4e2a0b10c1/raw?se=2026-09-14T09%3A26%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=30c85837-6117-56f7-a4ee-e4346a7faafc&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T08%3A58%3A41Z&ske=2026-09-15T08%3A58%3A41Z&sks=b&skv=2026-02-06&sig=YjahotfOTGwGml1TEX8uEJd4UpJx/B1pbA/ZvR84ZdQ%3D' -o smartgen-flasher.zip
          rm -rf imported
          mkdir imported
          unzip -q smartgen-flasher.zip -d imported

      - name: Publish OTA channels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          root = Path(".")
          imported = Path("imported/firmware")
          version = "4.3.2-UNIVERSAL-UA"
          raw_root = "https://raw.githubusercontent.com/maksbit/smartgen-releases/refs/heads/main"

          mapping = {
              "wt32-eth01": imported / "wt32-eth01-4mb" / "firmware.bin",
              "esp32-s3-w5500": imported / "esp32-s3-w5500-16mb" / "firmware.bin",
              "esp32-s3-w5500-8mb": imported / "esp32-s3-w5500-8mb" / "firmware.bin",
              "ts2137y-s3-zero": imported / "ts2137y-s3-zero-4mb" / "firmware.bin",
              "esp32-s3-zero": imported / "ts2137y-s3-zero-4mb" / "firmware.bin",
          }

          for channel, source in mapping.items():
              if not source.is_file():
                  raise SystemExit(f"Missing source firmware for {channel}: {source}")
              target = root / channel
              target.mkdir(parents=True, exist_ok=True)
              firmware = target / "firmware.bin"
              shutil.copy2(source, firmware)

              payload = firmware.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              manifest = {
                  "version": version,
                  "channel": channel,
                  "url": f"{raw_root}/{channel}/firmware.bin",
                  "sha256": digest,
                  "size": len(payload),
              }
              (target / "version.json").write_text(
                  json.dumps(manifest, indent=4) + "\n", encoding="utf-8"
              )

              verify = hashlib.sha256(firmware.read_bytes()).hexdigest()
              if verify != digest:
                  raise SystemExit(f"SHA mismatch after copy for {channel}")
              print(channel, len(payload), digest)
          PY

      - name: Commit OTA 4.3.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf imported smartgen-flasher.zip
          git config user.name "SmartGen OTA Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add wt32-eth01 esp32-s3-w5500 esp32-s3-w5500-8mb ts2137y-s3-zero esp32-s3-zero
          if git diff --cached --quiet; then
            echo "No release changes."
            exit 0
          fi
          git commit -m "Publish SmartGen 4.3.2 OTA"
          git push origin main
